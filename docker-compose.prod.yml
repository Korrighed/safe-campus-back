services:
    sc_back:
        build:
            context: .
            dockerfile: docker/8.4/Dockerfile.prod
            args:
                APP_PORT: '${APP_PORT:-8000}'
        image: safe-campus-back-sc_back-prod
        container_name: SC_Back_Prod
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:${APP_PORT:-8000}'
        environment:
            APP_PORT: '${APP_PORT:-8000}'
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: '${APP_KEY}'
            APP_URL: '${APP_URL}'
            # Sans DB_CONNECTION, config/database.php retombe sur sqlite : pas de
            # .env dans l'image, donc rien d'autre ne fixe la connexion.
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            LOG_LEVEL: error
            CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS}'
            SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS}'
            ADMIN_EMAIL: '${ADMIN_EMAIL}'
            ADMIN_PASSWORD: '${ADMIN_PASSWORD}'
            # Portillon visiteur du prototype (S-10) : la migration seed_visiteur
            # leve une exception sans VISITEUR_PASSWORD.
            VISITEUR_EMAIL: '${VISITEUR_EMAIL}'
            VISITEUR_PASSWORD: '${VISITEUR_PASSWORD}'
        # Medias uploades et journaux (audit compris) : sans volume, chaque
        # redeploiement les efface (S-06).
        volumes:
            - 'scback-storage-prod:/var/www/html/storage/app'
            - 'scback-logs-prod:/var/www/html/storage/logs'
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - scback_prod
        # Point de depart, pas mesure en charge reelle (a ajuster selon le trafic
        # observe en production) : cf. docs/infra.md pour la mesure au repos en dev.
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2G
                reservations:
                    memory: 1G

    pgsql:
        image: 'postgres:17'
        container_name: SC_Postgres_Prod
        restart: unless-stopped
        # Pas de port publie sur l'hote : seul sc_back doit atteindre la base,
        # via le reseau interne (contrairement au stack dev, pas d'Adminer non plus).
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'scback-pgsql-prod:/var/lib/postgresql/data'
        networks:
            - scback_prod
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 2G
                reservations:
                    memory: 1G

networks:
    scback_prod:
        # Nom distinct du reseau dev (`scback`) : les deux stacks peuvent tourner
        # cote a cote sans collision.
        name: scback_prod
        driver: bridge

volumes:
    scback-pgsql-prod:
        driver: local
    scback-storage-prod:
        driver: local
    scback-logs-prod:
        driver: local
