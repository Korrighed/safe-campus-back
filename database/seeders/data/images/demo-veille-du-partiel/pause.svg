<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Une pause : un cercle qui grandit et rétrécit pour guider la respiration</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .souffle { transform-box: fill-box; transform-origin: center; animation: souffle 10s ease-in-out infinite; }
    .souffle-lent { transform-box: fill-box; transform-origin: center; animation: souffle 10s ease-in-out infinite; animation-delay: -.4s; }
    @keyframes souffle { 0%, 100% { transform: scale(.62); } 50% { transform: scale(1); } }
    .inspire { animation: inspire 10s infinite; }
    .expire { animation: expire 10s infinite; opacity: 0; }
    @keyframes inspire { 0%, 44% { opacity: 1; } 50%, 94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes expire { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .pensee { animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    @keyframes p1 { 0% { opacity: .9; transform: translate(0, 0); } 45%, 100% { opacity: 0; transform: translate(-30px, -40px); } }
    @keyframes p2 { 0%, 15% { opacity: .9; transform: translate(0, 0); } 60%, 100% { opacity: 0; transform: translate(30px, -40px); } }
    @keyframes p3 { 0%, 30% { opacity: .9; transform: translate(0, 0); } 75%, 100% { opacity: 0; transform: translate(-20px, -40px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a4c"/>
      <stop offset="1" stop-color="#2f5d62"/>
    </linearGradient>
    <radialGradient id="cercle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe8dc"/>
      <stop offset="1" stop-color="#7cc5b5"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>

  <!-- Pensees qui s'eloignent -->
  <g font-size="20" fill="#e3eef0" font-style="italic">
    <g class="pensee p1">
      <rect x="70" y="80" width="230" height="46" rx="23" fill="#ffffff" fill-opacity=".12"/>
      <text x="92" y="110">« si je rate… »</text>
    </g>
    <g class="pensee p2">
      <rect x="730" y="110" width="250" height="46" rx="23" fill="#ffffff" fill-opacity=".12"/>
      <text x="752" y="140">« je perds mon année »</text>
    </g>
    <g class="pensee p3">
      <rect x="110" y="400" width="210" height="46" rx="23" fill="#ffffff" fill-opacity=".12"/>
      <text x="132" y="430">« et si… »</text>
    </g>
  </g>

  <!-- Cercle de respiration -->
  <circle cx="512" cy="280" r="200" fill="#bfe8dc" fill-opacity=".12" class="souffle-lent"/>
  <circle cx="512" cy="280" r="160" fill="url(#cercle)" class="souffle"/>
  <g font-size="34" font-weight="600" fill="#1e3a4c" text-anchor="middle">
    <text x="512" y="292" class="inspire">Inspire…</text>
    <text x="512" y="292" class="expire">Expire…</text>
  </g>
  <text x="512" y="520" font-size="18" fill="#cfe3e0" text-anchor="middle">5 secondes pour inspirer, 5 secondes pour expirer</text>

  <!-- Telephone retourne -->
  <g transform="rotate(-12 880 470)">
    <rect x="820" y="430" width="120" height="70" rx="14" fill="#10131f"/>
    <circle cx="845" cy="452" r="8" fill="#2a3150"/>
  </g>
</svg>
