<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Le lendemain : un réveil qui sonne à 7h, un brouillard qui flotte sur le bureau et brouille les notes de cours</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .reveil { transform-origin: 220px 210px; animation: sonne 3s ease-in-out infinite; }
    @keyframes sonne { 0%, 40%, 100% { transform: rotate(0); } 5%, 15%, 25%, 35% { transform: rotate(-8deg); } 10%, 20%, 30% { transform: rotate(8deg); } }
    .onde { animation: onde 3s ease-out infinite; opacity: 0; }
    @keyframes onde { 0% { opacity: 0; } 5% { opacity: .8; } 40%, 100% { opacity: 0; } }
    .brume { animation: derive 14s ease-in-out infinite alternate; }
    .b2 { animation-duration: 18s; animation-delay: -6s; }
    @keyframes derive { 0% { transform: translateX(-40px); } 100% { transform: translateX(40px); } }
    .notes { animation: flou 6s ease-in-out infinite; }
    @keyframes flou { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb3c8"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="flou" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>

  <!-- Bureau -->
  <rect x="0" y="380" width="1024" height="192" fill="#7c6a58"/>
  <rect x="0" y="380" width="1024" height="10" fill="#655546"/>

  <!-- Reveil -->
  <g class="reveil">
    <circle cx="220" cy="210" r="80" fill="#ef476f"/>
    <circle cx="220" cy="210" r="64" fill="#fff8f0"/>
    <circle cx="160" cy="138" r="22" fill="#ef476f"/>
    <circle cx="280" cy="138" r="22" fill="#ef476f"/>
    <text x="220" y="226" font-size="40" font-weight="700" fill="#33415c" text-anchor="middle">7:00</text>
    <rect x="170" y="284" width="16" height="24" rx="4" fill="#33415c"/>
    <rect x="254" y="284" width="16" height="24" rx="4" fill="#33415c"/>
  </g>
  <g fill="none" stroke="#ef476f" stroke-width="5" stroke-linecap="round" class="onde">
    <path d="M110 160 q-20 50 0 100"/><path d="M330 160 q20 50 0 100"/>
  </g>

  <!-- Cours flou -->
  <g class="notes">
    <rect x="460" y="300" width="380" height="120" rx="6" fill="#fffaf0" transform="rotate(-3 650 360)"/>
    <g stroke="#7d8597" stroke-width="5" stroke-linecap="round" transform="rotate(-3 650 360)">
      <line x1="490" y1="330" x2="800" y2="330"/>
      <line x1="490" y1="356" x2="760" y2="356"/>
      <line x1="490" y1="382" x2="790" y2="382"/>
    </g>
  </g>
  <rect x="700" y="420" width="90" height="10" rx="5" fill="#33415c" transform="rotate(-18 745 425)"/>

  <!-- Brouillard -->
  <g filter="url(#flou)" fill="#ffffff">
    <ellipse class="brume" cx="560" cy="330" rx="260" ry="60" fill-opacity=".55"/>
    <ellipse class="brume b2" cx="760" cy="250" rx="220" ry="50" fill-opacity=".45"/>
  </g>

  <text x="650" y="200" font-size="22" fill="#33415c" text-anchor="middle" font-style="italic">« j'ai relu ce paragraphe trois fois… »</text>
</svg>
