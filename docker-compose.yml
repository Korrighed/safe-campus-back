services:
    sc_back:
        build:
            context: .
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWUSER: '${WWWUSER:-1000}'
                WWWGROUP: '${WWWGROUP:-1000}'
                APP_PORT: '${APP_PORT:-8000}'
        container_name: SC_Back
        ports:
            - '${APP_PORT:-8000}:${APP_PORT:-8000}'
        volumes:
            - '.:/var/www/html'
        environment:
            APP_PORT: '${APP_PORT:-8000}'
            DB_HOST: pgsql
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - scback
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2.5G
                reservations:
                    memory: 1.5G

    pgsql:
        image: 'postgres:17'
        container_name: SC_Postgres
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'scback-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - scback
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 2G
                reservations:
                    memory: 1G

    adminer:
        image: 'adminer:latest'
        container_name: SC_Adminer
        ports:
            - '${ADMINER_PORT:-8080}:8080'
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - scback
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    memory: 128M

networks:
    scback:
        # Nom fixe : partage le reseau avec le docker-compose.yml de Safe-Campus-front,
        # que la stack back ou front soit demarree en premier.
        name: scback
        driver: bridge

volumes:
    scback-pgsql:
        driver: local
