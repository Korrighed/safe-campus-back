<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Message privé : « ça va ? », une réponse qui hésite, « c'est rien, laisse tomber », puis le silence</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .etape { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .moi { animation-name: moi; }
    .hesite { animation-name: hesite; opacity: 0; }
    .reponse { animation-name: reponse; }
    .vu { animation-name: vu; }
    @keyframes moi { 0%, 4% { opacity: 0; transform: translateY(12px); } 8%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes hesite { 0%, 12% { opacity: 0; } 14%, 26% { opacity: 1; } 28%, 36% { opacity: 0; } 38%, 50% { opacity: 1; } 52%, 100% { opacity: 0; } }
    @keyframes reponse { 0%, 54% { opacity: 0; transform: translateY(12px); } 58%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes vu { 0%, 64% { opacity: 0; } 68%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .point { animation: rebond 1.2s ease-in-out infinite; }
    .point2 { animation-delay: -.8s; } .point3 { animation-delay: -.4s; }
    @keyframes rebond { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2347"/>
      <stop offset="1" stop-color="#3d3160"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>
  <circle cx="180" cy="140" r="90" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="860" cy="430" r="120" fill="#ffffff" fill-opacity=".04"/>

  <!-- Telephone -->
  <rect x="382" y="40" width="260" height="500" rx="32" fill="#0f111c"/>
  <rect x="394" y="72" width="236" height="440" rx="12" fill="#f3f1f8"/>

  <!-- En-tete : contact sans visage ni prenom -->
  <rect x="394" y="72" width="236" height="48" rx="12" fill="#6b5a9e"/>
  <rect x="394" y="100" width="236" height="20" fill="#6b5a9e"/>
  <circle cx="420" cy="96" r="14" fill="#a99bd1"/>
  <circle cx="420" cy="91" r="5" fill="#6b5a9e"/>
  <path d="M410 106 q10 -10 20 0" fill="#6b5a9e"/>
  <text x="442" y="100" font-size="14" font-weight="700" fill="#fff">Message privé</text>

  <!-- Mon message -->
  <g class="etape moi">
    <rect x="530" y="150" width="86" height="34" rx="17" fill="#6b5a9e"/>
    <text x="548" y="172" font-size="14" fill="#fff">ça va ?</text>
  </g>

  <!-- Elle ecrit, s'arrete, reprend -->
  <g class="etape hesite">
    <rect x="408" y="206" width="58" height="30" rx="15" fill="#ffffff"/>
    <circle cx="424" cy="221" r="4" fill="#8a8fa8" class="point"/>
    <circle cx="437" cy="221" r="4" fill="#8a8fa8" class="point point2"/>
    <circle cx="450" cy="221" r="4" fill="#8a8fa8" class="point point3"/>
  </g>

  <!-- Sa reponse -->
  <g class="etape reponse">
    <rect x="408" y="206" width="180" height="34" rx="17" fill="#ffffff"/>
    <text x="424" y="228" font-size="14" fill="#2d3045">c'est rien, laisse tomber</text>
  </g>

  <!-- Puis plus rien -->
  <g class="etape vu">
    <text x="616" y="200" font-size="11" fill="#8a85a3" text-anchor="end">Vu 22:14</text>
    <text x="512" y="380" font-size="13" fill="#b3aec7" text-anchor="middle" font-style="italic">plus de nouvelles</text>
  </g>

  <!-- Barre de saisie -->
  <rect x="404" y="476" width="216" height="28" rx="14" fill="#ffffff" stroke="#dcd8e8"/>
  <text x="418" y="495" font-size="12" fill="#a39fb8">Écrire un message…</text>
</svg>
