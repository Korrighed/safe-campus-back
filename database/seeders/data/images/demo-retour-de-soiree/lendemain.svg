<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Le lendemain : ton amie t'écrit qu'il a déjà fait ça à d'autres filles et qu'elle ne sait pas quoi faire</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .etape { animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; }
    .ecrit { animation-name: ecrit; opacity: 0; }
    @keyframes m1 { 0%, 4% { opacity: 0; transform: translateY(12px); } 8%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes m2 { 0%, 24% { opacity: 0; transform: translateY(12px); } 28%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes m3 { 0%, 50% { opacity: 0; transform: translateY(12px); } 54%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes ecrit { 0%, 30% { opacity: 0; } 32%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .point { animation: rebond 1.2s ease-in-out infinite; }
    .point2 { animation-delay: -.8s; } .point3 { animation-delay: -.4s; }
    @keyframes rebond { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .soleil { animation: rayons 20s linear infinite; transform-origin: 860px 120px; }
    @keyframes rayons { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe5ec"/>
      <stop offset="1" stop-color="#ffc2d1"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>
  <g class="soleil" stroke="#ffb703" stroke-width="5" stroke-linecap="round">
    <line x1="860" y1="60" x2="860" y2="76"/><line x1="860" y1="164" x2="860" y2="180"/>
    <line x1="800" y1="120" x2="816" y2="120"/><line x1="904" y1="120" x2="920" y2="120"/>
    <line x1="818" y1="78" x2="828" y2="88"/><line x1="892" y1="152" x2="902" y2="162"/>
    <line x1="818" y1="162" x2="828" y2="152"/><line x1="892" y1="88" x2="902" y2="78"/>
  </g>
  <circle cx="860" cy="120" r="34" fill="#ffb703"/>

  <!-- Telephone -->
  <rect x="382" y="40" width="260" height="500" rx="32" fill="#0f111c"/>
  <rect x="394" y="72" width="236" height="440" rx="12" fill="#fff5f7"/>
  <rect x="394" y="72" width="236" height="48" rx="12" fill="#c9184a"/>
  <rect x="394" y="100" width="236" height="20" fill="#c9184a"/>
  <circle cx="420" cy="96" r="14" fill="#ff8fa3"/>
  <text x="442" y="100" font-size="14" font-weight="700" fill="#fff">Mon amie</text>

  <g class="etape m1">
    <rect x="408" y="140" width="196" height="34" rx="17" fill="#ffffff"/>
    <text x="424" y="162" font-size="14" fill="#2d3045">merci encore pour hier</text>
  </g>
  <g class="etape m2">
    <rect x="408" y="186" width="210" height="54" rx="17" fill="#ffffff"/>
    <text x="424" y="208" font-size="14" fill="#2d3045">il paraît qu'il a déjà fait</text>
    <text x="424" y="228" font-size="14" fill="#2d3045">ça avec d'autres filles</text>
  </g>
  <g class="etape ecrit">
    <rect x="408" y="252" width="58" height="30" rx="15" fill="#ffffff"/>
    <circle cx="424" cy="267" r="4" fill="#8a8fa8" class="point"/>
    <circle cx="437" cy="267" r="4" fill="#8a8fa8" class="point point2"/>
    <circle cx="450" cy="267" r="4" fill="#8a8fa8" class="point point3"/>
  </g>
  <g class="etape m3">
    <rect x="408" y="252" width="178" height="34" rx="17" fill="#ffffff"/>
    <text x="424" y="274" font-size="14" fill="#2d3045">je sais pas quoi faire</text>
  </g>

  <rect x="404" y="476" width="216" height="28" rx="14" fill="#ffffff" stroke="#f3d1da"/>
  <text x="418" y="495" font-size="12" fill="#b892a0">Écrire un message…</text>
</svg>
