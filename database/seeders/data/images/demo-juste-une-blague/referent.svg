<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">À qui en parler : un carnet de notes datées, et des panneaux d'orientation qui s'allument vers la Médiation UNC et le CIDFE</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ligne { stroke-dasharray: 240; stroke-dashoffset: 240; animation: ecrit 9s ease-out infinite; }
    .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; }
    @keyframes ecrit { 0%, 5% { stroke-dashoffset: 240; } 20%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 240; } }
    .panneau { animation: allume 9s ease-in-out infinite; opacity: .35; }
    .p2 { animation-delay: .8s; }
    @keyframes allume { 0%, 30% { opacity: .35; } 40%, 90% { opacity: 1; } 100% { opacity: .35; } }
    .duo { animation: avance 9s ease-in-out infinite; }
    @keyframes avance { 0%, 40% { transform: translateX(0); } 75%, 92% { transform: translateX(80px); } 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ligne { stroke-dashoffset: 0; }
      .panneau { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f2fd"/>
      <stop offset="1" stop-color="#cfe3f5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>
  <rect x="0" y="470" width="1024" height="102" fill="#a9c1d9"/>

  <!-- Carnet de notes -->
  <g transform="rotate(-4 220 300)">
    <rect x="80" y="150" width="280" height="300" rx="10" fill="#fffdf7"/>
    <rect x="80" y="150" width="24" height="300" rx="10" fill="#9b5de5"/>
    <text x="126" y="190" font-size="18" font-weight="700" fill="#3c096c">Ce qui s'est passé</text>
    <g font-size="14" fill="#7b2cbf">
      <text x="126" y="230">12/10</text><text x="126" y="290">19/10</text><text x="126" y="350">20/10</text>
    </g>
    <g stroke="#6c757d" stroke-width="4" stroke-linecap="round">
      <line class="ligne" x1="126" y1="250" x2="330" y2="250"/>
      <line class="ligne l2" x1="126" y1="310" x2="310" y2="310"/>
      <line class="ligne l3" x1="126" y1="370" x2="330" y2="370"/>
    </g>
  </g>

  <!-- Poteau et panneaux -->
  <rect x="720" y="120" width="16" height="360" fill="#5c677d"/>
  <g class="panneau">
    <path d="M736 150 h200 l30 30 l-30 30 h-200 z" fill="#2a9d8f"/>
    <text x="840" y="188" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Médiation UNC</text>
  </g>
  <g class="panneau p2">
    <path d="M720 240 h-200 l-30 30 l30 30 h200 z" fill="#e76f51"/>
    <text x="610" y="278" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">CIDFE</text>
  </g>

  <!-- Toi et ta camarade -->
  <g class="duo">
    <g fill="#9b5de5"><circle cx="500" cy="380" r="26"/><rect x="474" y="406" width="52" height="70" rx="18"/></g>
    <g fill="#f15bb5"><circle cx="570" cy="376" r="26"/><rect x="544" y="402" width="52" height="74" rx="18"/></g>
  </g>
</svg>
