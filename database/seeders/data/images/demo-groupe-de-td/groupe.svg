<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Le groupe de TD : une photo floutée partagée dans une conversation de groupe, les moqueries et les réactions s'accumulent</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .message { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; }
    @keyframes m1 { 0%, 12% { opacity: 0; transform: translateY(12px); } 17%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes m2 { 0%, 32% { opacity: 0; transform: translateY(12px); } 37%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes m3 { 0%, 52% { opacity: 0; transform: translateY(12px); } 57%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    .compteur { animation-duration: 10s; animation-iteration-count: infinite; }
    .r1 { animation-name: r1; opacity: 0; } .r2 { animation-name: r2; opacity: 0; }
    .r3 { animation-name: r3; opacity: 0; } .r4 { animation-name: r4; }
    @keyframes r1 { 0%, 19% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 19% { opacity: 0; } 20%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 44% { opacity: 0; } 45%, 69% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 69% { opacity: 0; } 70%, 100% { opacity: 1; } }
    .ecrit { animation: ecrit 10s infinite; }
    @keyframes ecrit { 0%, 60% { opacity: 0; } 64%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .point { animation: rebond 1.2s ease-in-out infinite; }
    .point2 { animation-delay: -.8s; } .point3 { animation-delay: -.4s; }
    @keyframes rebond { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .plus { animation: monte 3s ease-out infinite; }
    .plus2 { animation-delay: -1s; } .plus3 { animation-delay: -2s; }
    @keyframes monte { 0% { opacity: 0; transform: translateY(20px); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-60px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .plus { opacity: 0; }
    }
  </style>
  <defs>
    <filter id="flou" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f3a"/>
      <stop offset="1" stop-color="#2a2550"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>

  <!-- Reactions qui montent autour du telephone -->
  <g font-size="18" font-weight="700" fill="#ffcf5c">
    <text x="300" y="300" class="plus">ha ha</text>
    <text x="690" y="250" class="plus plus2">+1</text>
    <text x="700" y="380" class="plus plus3">ha ha</text>
    <text x="270" y="420" class="plus plus2">+1</text>
  </g>

  <!-- Telephone -->
  <rect x="382" y="40" width="260" height="500" rx="32" fill="#0f111c"/>
  <rect x="394" y="72" width="236" height="440" rx="12" fill="#eef0f6"/>

  <!-- En-tete de la conversation -->
  <rect x="394" y="72" width="236" height="48" rx="12" fill="#5b5fc7"/>
  <rect x="394" y="100" width="236" height="20" fill="#5b5fc7"/>
  <circle cx="420" cy="96" r="14" fill="#8e91e0"/>
  <text x="442" y="93" font-size="14" font-weight="700" fill="#fff">Groupe TD</text>
  <text x="442" y="110" font-size="11" fill="#dcdcf7">34 membres</text>

  <!-- Photo floutee, jamais montree -->
  <circle cx="412" cy="140" r="10" fill="#e0855a"/>
  <rect x="428" y="130" width="186" height="150" rx="12" fill="#ffffff"/>
  <g filter="url(#flou)">
    <rect x="438" y="140" width="166" height="96" fill="#9aa3b5"/>
    <circle cx="500" cy="180" r="24" fill="#7b8499"/>
    <rect x="530" y="170" width="60" height="50" fill="#b5bccb"/>
  </g>
  <path d="M500 200 l14 -18 l10 12 l8 -8 l14 14 z" fill="#ffffff" fill-opacity=".85"/>
  <text x="440" y="256" font-size="12" fill="#2d3045">regardez qui dort en TD</text>
  <rect x="440" y="264" width="82" height="22" rx="11" fill="#fff3d4" stroke="#f1c75b"/>
  <text x="450" y="279" font-size="12" fill="#8a6411">ha ha</text>
  <g font-size="12" font-weight="700" fill="#8a6411">
    <text x="490" y="279" class="compteur r1">3</text>
    <text x="490" y="279" class="compteur r2">8</text>
    <text x="490" y="279" class="compteur r3">14</text>
    <text x="490" y="279" class="compteur r4">21</text>
  </g>

  <!-- Moqueries qui s'enchainent -->
  <g class="message m1">
    <circle cx="412" cy="318" r="10" fill="#57a773"/>
    <rect x="428" y="304" width="62" height="30" rx="15" fill="#ffffff"/>
    <text x="442" y="324" font-size="13" fill="#2d3045">ptdr</text>
  </g>
  <g class="message m2">
    <circle cx="412" cy="362" r="10" fill="#c75b8a"/>
    <rect x="428" y="348" width="168" height="30" rx="15" fill="#ffffff"/>
    <text x="442" y="368" font-size="13" fill="#2d3045">elle dort tout le temps</text>
  </g>
  <g class="message m3">
    <circle cx="412" cy="406" r="10" fill="#e0855a"/>
    <rect x="428" y="392" width="160" height="30" rx="15" fill="#ffffff"/>
    <text x="442" y="412" font-size="13" fill="#2d3045">en fond d'écran direct</text>
  </g>

  <!-- Quelqu'un est en train d'ecrire -->
  <g class="ecrit">
    <rect x="428" y="438" width="58" height="28" rx="14" fill="#ffffff"/>
    <circle cx="444" cy="452" r="4" fill="#8a8fa8" class="point"/>
    <circle cx="457" cy="452" r="4" fill="#8a8fa8" class="point point2"/>
    <circle cx="470" cy="452" r="4" fill="#8a8fa8" class="point point3"/>
  </g>

  <!-- Barre de saisie -->
  <rect x="404" y="476" width="216" height="28" rx="14" fill="#ffffff" stroke="#d5d8e4"/>
  <text x="418" y="495" font-size="12" fill="#a3a8bd">Écrire un message…</text>
</svg>
