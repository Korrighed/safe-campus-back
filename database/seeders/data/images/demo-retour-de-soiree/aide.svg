<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" role="img" aria-labelledby="titre">
  <title id="titre">Être accompagnée : un accueil associatif chaleureux, une écoutante qui accueille ton amie, toi à ses côtés</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lampe { animation: lampe 5s ease-in-out infinite; }
    @keyframes lampe { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
    .bulle { animation: bulle 9s ease-in-out infinite; opacity: 0; }
    @keyframes bulle { 0%, 10% { opacity: 0; transform: translateY(8px); } 18%, 88% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    .main { transform-box: fill-box; transform-origin: left center; animation: main 9s ease-in-out infinite; }
    @keyframes main { 0%, 30% { transform: scaleX(.5); } 45%, 90% { transform: scaleX(1); } 100% { transform: scaleX(.5); } }
    .feuille { transform-box: fill-box; transform-origin: bottom center; animation: balance 5s ease-in-out infinite; }
    .f2 { animation-delay: -2.5s; }
    @keyframes balance { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bulle { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <radialGradient id="chaud" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="572" fill="url(#fond)"/>
  <rect x="0" y="470" width="1024" height="102" fill="#d4a373"/>

  <!-- Lampe -->
  <circle class="lampe" cx="160" cy="180" r="140" fill="url(#chaud)"/>
  <rect x="152" y="180" width="16" height="290" fill="#6b4f3a"/>
  <path d="M110 180 h100 l-20 -60 h-60 z" fill="#f4a261"/>

  <!-- Panneau d'accueil -->
  <rect x="660" y="70" width="280" height="70" rx="12" fill="#2a9d8f"/>
  <text x="800" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Accueil · Écoute</text>
  <text x="800" y="126" font-size="14" fill="#e9f5f3" text-anchor="middle">gratuit · confidentiel</text>

  <!-- Plante -->
  <g transform="translate(940 420)">
    <rect x="-26" y="10" width="52" height="50" rx="8" fill="#e76f51"/>
    <path class="feuille" d="M0 10 q-36 -50 -8 -100 q16 50 8 100z" fill="#2a9d8f"/>
    <path class="feuille f2" d="M0 10 q36 -46 14 -90 q-24 44 -14 90z" fill="#40916c"/>
  </g>

  <!-- Canape -->
  <rect x="260" y="380" width="360" height="90" rx="26" fill="#bc6c25"/>
  <rect x="260" y="340" width="360" height="60" rx="26" fill="#dda15e"/>

  <!-- Toi et ton amie -->
  <g fill="#ffd166"><circle cx="350" cy="320" r="28"/><rect x="320" y="348" width="60" height="80" rx="20"/></g>
  <g fill="#f15bb5"><circle cx="470" cy="316" r="28"/><rect x="440" y="344" width="60" height="84" rx="20"/></g>
  <rect class="main" x="374" y="380" width="72" height="12" rx="6" fill="#ffd166"/>

  <!-- Ecoutante -->
  <rect x="700" y="400" width="100" height="14" rx="4" fill="#6b4f3a"/>
  <rect x="700" y="330" width="14" height="84" rx="4" fill="#6b4f3a"/>
  <g fill="#2a9d8f"><circle cx="760" cy="300" r="30"/><rect x="728" y="330" width="64" height="90" rx="22"/></g>

  <g class="bulle">
    <rect x="540" y="170" width="300" height="80" rx="20" fill="#ffffff" stroke="#2a9d8f" stroke-width="3"/>
    <path d="M740 250 l14 30 l10 -30 z" fill="#ffffff" stroke="#2a9d8f" stroke-width="3" stroke-linejoin="round"/>
    <rect x="741" y="246" width="22" height="8" fill="#ffffff"/>
    <text x="690" y="204" font-size="17" fill="#1d6f66" text-anchor="middle">« On avance à ton rythme.</text>
    <text x="690" y="230" font-size="17" fill="#1d6f66" text-anchor="middle">C'est toi qui décides. »</text>
  </g>
</svg>
